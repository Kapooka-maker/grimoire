<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire - Recherche de Sorts D&D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🔮 Grimoire</h1>
            <p>Recherche de sorts & gestion du livre de sorts</p>
        </header>

        <nav class="tabs">
            <button id="tab-recherche" class="tab-btn active" onclick="changerOnglet('recherche')">🔍 Recherche</button>
            <button id="tab-favoris" class="tab-btn" onclick="changerOnglet('favoris')">📖 Mon Grimoire (<span id="fav-count">0</span>)</button>
        </nav>

        <!-- Section Recherche -->
        <main id="section-recherche" class="section active">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Rechercher par nom, description..." onkeyup="filtrerSorts()">
                <select id="filter-classe" onchange="filtrerSorts()">
                    <option value="">Toutes les classes</option>
                    <option value="Barde">Barde</option>
                    <option value="Clerc">Clerc</option>
                    <option value="Magicien">Magicien</option>
                    <option value="Paladin">Paladin</option>
                    <option value="Ensorceleur">Ensorceleur</option>
                    <option value="Druide">Druide</option>
                    <option value="Sorcier">Sorcier</option>
                    <option value="Rôdeur">Rôdeur</option>
                </select>
                <select id="filter-niveau" onchange="filtrerSorts()">
                    <option value="">Tous les niveaux</option>
                    <option value="0">Tours de magie (0)</option>
                    <option value="1">Niveau 1</option>
                    <option value="2">Niveau 2</option>
                    <option value="3">Niveau 3</option>
                    <option value="4">Niveau 4</option>
                    <option value="5">Niveau 5</option>
                    <option value="6">Niveau 6</option>
                    <option value="7">Niveau 7</option>
                    <option value="8">Niveau 8</option>
                    <option value="9">Niveau 9</option>
                </select>
            </div>

            <div id="resultats-liste" class="sorts-grid"></div>
        </main>

        <!-- Section Favoris -->
        <main id="section-favoris" class="section">
            <div id="favoris-liste" class="sorts-grid"></div>
        </main>
    </div>

    <!-- Modal pour afficher les détails du sort -->
    <div id="spell-modal" class="modal" onclick="fermerModal(event)">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModal(null, true)">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
